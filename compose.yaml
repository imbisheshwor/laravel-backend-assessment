services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hmis
      POSTGRES_USER: hmis
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${HMIS_PG_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmis -d hmis"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=5", "--timeout=60"]
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
volumes:
  postgres-data:
